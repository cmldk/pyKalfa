title: Rolove Prototip
tooltip: >
  Polycam taramasindan toparlanmis, dosemeli hizli prototip: neredeyse dik
  koseler 90 dereceye, katlar arasi dis duvarlar ayni hatta oturur; her
  kata doseme eklenir, duvarlar ust katin Level'ina baglanip dosemenin
  altinda biter. Girdiler Rolove Aktar ile ayni. Olculen rolove degildir:
  yerinden oynayan duvarlar "duzeltildi" isaretlenir, ince olculer sonradan
  elle duzeltilir. Rolove Aktar ile ayni projede kullanmayin.
